<style>
/* Layout: one phone-width column; the amber scoreboard reel is the hero of every draft round. Deliberately single dark "stadium at night" theme. */
:root{
  --bg:#0b111c; --panel:#121b2b; --panel2:#18233a; --line:#25324a;
  --chalk:#edf1f7; --muted:#8a97ae; --ink:#1a1204;
  --bulb:#ffb320; --bulb-soft:rgba(255,179,32,.14);
  --win:#3fd99a; --loss:#ff6767; --draw:#a3aec2;
  --t90:#ffd34d; --t85:#5fe3a9; --t80:#72b6ff; --t70:#aab4c6;
  --turf:#1d6a3e; --turf2:#195c36; --chalkline:rgba(255,255,255,.45);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;padding:10px 16px 48px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;background:none;border:0;touch-action:manipulation;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--bulb);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;gap:10px;min-height:40px}
.top .back{font-family:var(--cond);font-weight:600;font-size:15px;color:var(--muted);padding:8px 10px 8px 0;letter-spacing:.04em;text-transform:uppercase}
.top .ttl{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase;flex:1}
.top .meta{font-family:var(--cond);font-size:14px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* home */
.hero{padding-block:22px 6px}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(64px,21vw,104px);line-height:.86;letter-spacing:-.01em;margin:0;text-transform:uppercase}
.hero h1 span{color:var(--bulb);display:block;text-shadow:0 0 28px rgba(255,179,32,.35)}
.hero p{color:var(--muted);margin:14px 0 0;font-size:16px;max-width:34ch}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:14px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.mode:active{background:var(--panel2)}
.mode .tag{font-family:var(--display);font-weight:900;font-size:22px;color:var(--ink);background:var(--bulb);border-radius:10px;height:56px;display:grid;place-items:center;letter-spacing:.02em}
.mode .nm{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.mode .ds{color:var(--muted);font-size:13px;margin-top:4px}
.mode .best{font-family:var(--cond);font-size:13px;color:var(--bulb);margin-top:4px;letter-spacing:.02em}
.mode .go{color:var(--muted);font-size:22px}
.foot{color:var(--muted);font-size:12px;text-align:center;padding-top:6px}

/* reel */
.reel{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:radial-gradient(120% 140% at 50% 0%,#1d2840 0%,#0e1524 70%);padding:16px 14px 18px;text-align:center}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px)}
.reel .lbl{font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.reel .txt{font-family:var(--display);font-weight:900;font-size:clamp(30px,9.5vw,46px);line-height:1.05;color:var(--bulb);text-transform:uppercase;letter-spacing:.02em;margin-top:8px;min-height:1.1em;text-shadow:0 0 18px rgba(255,179,32,.5);text-wrap:balance}
.reel .txt.idle{color:#5b4a26;text-shadow:none}
.reel .txt.land{animation:land .35s ease-out}
.reel .sub{color:var(--muted);font-size:13px;margin-top:6px;min-height:1.2em}
@keyframes land{0%{transform:scale(1.18)}100%{transform:scale(1)}}
.row{display:flex;gap:10px}
.btn{flex:1;min-height:50px;border-radius:12px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;background:var(--bulb);color:var(--ink);padding:0 16px}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:transparent;color:var(--chalk);border:1px solid var(--line)}
.btn:disabled{opacity:.35}
.btn.sm{flex:0 0 auto;font-size:16px;min-height:50px}

/* lists */
.sec{display:flex;flex-direction:column;gap:8px}
.sec h2{font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.list{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:10px 12px;text-align:left;border-top:1px solid var(--line);min-height:56px}
.item:first-child{border-top:0}
button.item:active{background:var(--panel2)}
.item.off{opacity:.38}
.item .pos{font-family:var(--cond);font-weight:700;font-size:14px;color:var(--muted);letter-spacing:.04em}
.item .nm{font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .note{color:var(--muted);font-size:12px}
.item .note b{color:var(--bulb);font-weight:600}
.ovr{font-family:var(--display);font-weight:900;font-size:20px;min-width:44px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink)}
.ovr.t90{background:var(--t90)} .ovr.t85{background:var(--t85)} .ovr.t80{background:var(--t80)} .ovr.t70{background:var(--t70)}
.ovr.empty{background:transparent;border:1px dashed var(--line);color:var(--muted)}

/* attribute picker */
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.attr{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;min-height:54px}
.attr:active{background:var(--panel2)}
.attr.off{opacity:.35}
.attr .k{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.attr .k small{display:block;font-family:var(--body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0;text-transform:none}
.bars{display:flex;flex-direction:column;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.bar{display:grid;grid-template-columns:76px 1fr 30px;align-items:center;gap:10px}
.bar .k{font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.bar .k small{display:block;font-family:var(--body);font-size:10px;color:var(--muted);letter-spacing:0;text-transform:none;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .trk{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--bulb);border-radius:6px}
.bar .v{font-family:var(--display);font-weight:800;font-size:18px;text-align:right}

/* pitch */
.pitch{position:relative;width:100%;max-width:100%;aspect-ratio:68/88;border-radius:14px;overflow:hidden;background:repeating-linear-gradient(180deg,var(--turf) 0 11.11%,var(--turf2) 11.11% 22.22%);border:1px solid var(--line)}
.pitch .l{position:absolute;border:2px solid var(--chalkline)}
.pitch .half{left:0;right:0;top:50%;height:0;border-width:2px 0 0}
.pitch .circ{left:50%;top:50%;width:26%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
.pitch .boxT{left:22%;right:22%;top:-2px;height:15%}
.pitch .boxB{left:22%;right:22%;bottom:-2px;height:15%}
.pchip{position:absolute;transform:translate(-50%,-50%);width:76px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pchip .disc{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:17px;color:var(--ink);background:rgba(10,20,14,.55);border:2px dashed rgba(255,255,255,.55);color:var(--chalk)}
.pchip.full .disc{border:0;color:var(--ink)}
.pchip.full .disc.t90{background:var(--t90)} .pchip.full .disc.t85{background:var(--t85)} .pchip.full .disc.t80{background:var(--t80)} .pchip.full .disc.t70{background:var(--t70)}
.pchip .pn{font-family:var(--cond);font-weight:700;font-size:12px;line-height:1.1;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.pchip .pk{font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.06em;color:rgba(255,255,255,.75)}

/* review */
.big{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.big .ovrbig{font-family:var(--display);font-weight:900;font-size:64px;line-height:1;color:var(--bulb);min-width:84px;text-align:center}
.big .ovrbig small{display:block;font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.14em;color:var(--muted)}
.big .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.big label{font-family:var(--cond);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.big input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--chalk);font:600 17px var(--body);padding:10px 12px}
.big .proj{font-size:14px;color:var(--muted)} .big .proj b{color:var(--chalk)}

/* sim + results */
.simwrap{padding-block:30px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.simwrap .txt{font-family:var(--display);font-weight:900;font-size:40px;text-transform:uppercase;color:var(--bulb)}
.prog{width:100%;height:8px;background:var(--panel2);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--bulb);transition:width 1.5s linear}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.chip{width:22px;height:22px;border-radius:5px;font-family:var(--cond);font-weight:700;font-size:12px;display:grid;place-items:center;color:var(--ink)}
.chip.W{background:var(--win)} .chip.L{background:var(--loss)} .chip.D{background:var(--draw)}
.chips.hide .chip{visibility:hidden}
.verdict{border-radius:18px;padding:22px 18px;text-align:center;background:var(--panel);border:1px solid var(--line)}
.verdict.gold{background:linear-gradient(160deg,#3a2a07,#151b29 70%);border-color:#6a4d10}
.verdict .eb{font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.verdict h2{font-family:var(--display);font-weight:900;font-size:clamp(34px,11vw,52px);line-height:.95;margin:10px 0 0;text-transform:uppercase;text-wrap:balance}
.verdict.gold h2{color:var(--t90);text-shadow:0 0 24px rgba(255,211,77,.35)}
.verdict.bad h2{color:var(--loss)}
.verdict p{color:var(--muted);margin:10px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat .v{font-family:var(--display);font-weight:900;font-size:26px;line-height:1}
.stat .k{font-family:var(--cond);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.path .item{grid-template-columns:1fr auto}
.res{font-family:var(--cond);font-weight:700;font-size:15px;padding:4px 8px;border-radius:7px;color:var(--ink);white-space:nowrap}
.res.W{background:var(--win)} .res.L{background:var(--loss)}
.tblwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;text-align:right;white-space:nowrap}
th{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
td.n,th.n{text-align:left;max-width:170px;overflow:hidden;text-overflow:ellipsis}
td.p,th.p{text-align:center;color:var(--muted);width:28px}
tr.zone1 td.p{color:var(--win)} tr.zone2 td.p{color:var(--bulb)} tr.zone3 td.p{color:var(--loss)}
tr.you td{background:var(--bulb-soft);font-weight:700;color:var(--chalk)}
tr.you td.n{color:var(--bulb)}
tbody tr+tr td{border-top:1px solid rgba(37,50,74,.6)}
.legend{color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:reduce){.reel .txt.land{animation:none}.prog i{transition:none}}
</style>

function leaguePhase(n,k){

    const seen=new Set(),rounds=[];let ok=true;
    for(let r=0;r<k&&ok;r++){
      let done=null;
      for(let t=0;t<300&&!done;t++){
        const o=shuffle([...Array(n).keys()]),free=new Set(o),pairs=[];

        if(pairs.length===n/2)done=pairs;
      }
      if(!done){ok=false;break;}
      done.forEach(([a,b])=>seen.add(Math.min(a,b)+"-"+Math.max(a,b)));rounds.push(done);
    }
    if(ok)return rounds;

  return [...Array(k)].map(()=>{const o=shuffle([...Array(n).keys()]);const p=[];for(let i=0;i<n;i+=2)p.push([o[i],o[i+1]]);return p;});

function fight(U,O,rounds){

  if(U.a.WRS-O.a.WRS>8)p+=.04;if(O.a.WRS-U.a.WRS>8)p-=.04;
  if(U.a.STR-O.a.STR>8)p+=.03;if(O.a.STR-U.a.STR>8)p-=.03;
  p=Math.min(.94,Math.max(.06,p));
  const won=rnd()<p,W=won?U:O,L=won?O:U;
  const ko=Math.max(6,W.a.POW*.6+W.a.STR*.4-L.a.CHN*.7),sub=Math.max(6,W.a.GRP*.7+W.a.WRS*.3-L.a.GRP*.75),dec=Math.max(10,W.a.CAR*.5+W.a.IQ*.3-40);

  const rd=1+Math.floor(rnd()*rounds),tm=Math.floor(rnd()*4)+":"+String(Math.floor(rnd()*60)).padStart(2,"0");
  const how=x<ko?`KO/TKO · R${rd} ${tm}`:x<ko+sub?`Submission · R${rd} ${tm}`:(Math.abs(U.ovr-O.ovr)<2&&rnd()<.4?"Split decision":"Unanimous decision");
  return {won,how};
}

/* ---------- modes ---------- */
const MODES={
  nfl:{label:"NFL",tag:"NFL",kind:"team",teams:NFL,slots:NFL_SLOTS,season:simNFL,desc:"10 picks · 17-game season · playoffs",verb:"Simulate season"},
  nba:{label:"NBA",tag:"NBA",kind:"team",teams:NBA,slots:NBA_SLOTS,season:simNBA,desc:"7 picks · 82 games · Play-In & playoffs",verb:"Simulate season"},
  epl:{label:"Premier League",tag:"EPL",kind:"soccer",teams:EPL,season:simEPL,desc:"Spin a formation · 11 picks · 38 matches",verb:"Simulate season"},
  ucl:{label:"Champions League",tag:"UCL",kind:"soccer",teams:UCL,season:simUCL,desc:"Spin a formation · league phase & knockouts",verb:"Simulate campaign"},
  ufc:{label:"UFC",tag:"UFC",kind:"ufc",season:simUFC,desc:"Spin fighters · steal one attribute each · fight for the belt",verb:"Start the gauntlet"}
};
const leagueOf=m=>m==="ucl"?[...UCL.map(t=>t.rating),...UCL_EXTRA.map(x=>x[1])]:MODES[m].teams.map(t=>t.rating);

/* ---------- state ---------- */
let S={screen:"home"};
const M=()=>MODES[S.mode];
function startMode(key){
  const m=MODES[key];
  S={screen:m.kind==="soccer"?"formation":"draft",mode:key,respins:2,spun:null,used:[],formation:null,spinning:false,
     teamName:key==="ufc"?"The Draft Pick":"Your Team",result:null,
     slots:m.kind==="team"?m.slots.map(s=>({...s,player:null})):m.kind==="ufc"?ATTRS.map(([k,label,w])=>({k,label,w,val:null,from:null})):null};
  render();scrollTo(0,0);
}
const teamsOf=()=>M().teams;
const spunTeam=()=>S.mode==="ufc"?FIGHTERS.find(f=>f.id===S.spun):teamsOf().find(t=>t.id===S.spun);
function candidates(){
  if(S.mode==="ufc")return FIGHTERS.filter(f=>!S.used.includes(f.id));
  return teamsOf().filter(t=>t.players.some(p=>!S.used.includes(p.id)&&S.slots.some(s=>!s.player&&fits(p,s))));
}
function userRating(){
  if(S.mode==="ufc"){const a={};S.slots.forEach(s=>a[s.k]=s.val);return ufcOvr(a);}
  return weighted(S.slots.map(s=>s.player.ovr),S.slots);
}

const fitReel=(el,t)=>{el.style.fontSize=Math.min(46,Math.max(22,Math.floor(330/(t.length*.7))))+"px";};
function runReel(names,final,done){
  const el=document.getElementById("reelTxt");
  if(!el||reduced){done();return;}
  el.classList.remove("idle","land");
  let i=0,delay=45;const steps=16;
  const tick=()=>{i++;if(i>=steps){done();return;}{const n=pick(names);el.textContent=n;fitReel(el,n);}delay*=1.12;setTimeout(tick,delay);};
  tick();
}
function spin(respin){
  if(S.spinning)return;
  let pool=candidates();
  if(S.spun&&pool.length>1)pool=pool.filter(t=>t.id!==S.spun);
  if(!pool.length)return;
  if(respin)S.respins--;
  const target=pick(pool);S.spun=null;S.spinning=true;render();
  const names=S.mode==="ufc"?FIGHTERS.map(f=>f.name):teamsOf().map(t=>t.name);
  runReel(names,target.name,()=>{S.spinning=false;S.spun=target.id;S.landed=true;render();});
}
function spinFormation(){
  if(S.spinning)return;
  const keys=Object.keys(FORMATIONS),target=pick(keys);
  S.spinning=true;render();
  runReel(keys,target,()=>{S.spinning=false;S.formation=target;S.slots=FORMATIONS[target].map(s=>({...s,player:null}));S.landed=true;render();});
}
function draftPlayer(pid){
  const t=spunTeam(),p=t&&t.players.find(x=>x.id===pid);if(!p)return;
  const open=S.slots.filter(s=>!s.player&&fits(p,s));if(!open.length)return;
  (open.find(s=>natural(p,s))||open[0]).player=p;
  S.used.push(p.id);S.spun=null;
  if(S.slots.every(s=>s.player)){S.screen="review";scrollTo(0,0);}
  render();
}
function takeAttr(k){
  const f=spunTeam(),s=S.slots.find(x=>x.k===k);if(!f||!s||s.val!==null)return;
  s.val=f.a[k];s.from=f.name;S.used.push(f.id);S.spun=null;
  if(S.slots.every(x=>x.val!==null)){S.screen="review";scrollTo(0,0);}
  render();
}
function simulate(){
  const name=(document.getElementById("teamName")?.value||"").trim()||S.teamName;S.teamName=name;
  const rating=userRating();
  const user=S.mode==="ufc"?{name,ovr:rating,a:Object.fromEntries(S.slots.map(s=>[s.k,s.val]))}:{name,rating};
  S.result=M().season(user);
  const key="draftnight.best."+S.mode,best=store.get(key);
  S.newBest=!best||S.result.score>best.score;
  if(S.newBest)store.set(key,{score:S.result.score,label:S.result.headline});
  S.screen="sim";render();scrollTo(0,0);
  const chips=[...document.querySelectorAll("#simChips .chip")],bar=document.getElementById("simBar");
  const total=reduced?0:1500;
  requestAnimationFrame(()=>{if(bar)bar.style.width="100%";});
  chips.forEach((c,i)=>setTimeout(()=>c.style.visibility="visible",total*(i+1)/chips.length));
  setTimeout(()=>{if(S.screen==="sim"){S.screen="results";render();scrollTo(0,0);}},total+350);
}

/* ---------- views ---------- */
const ovrBadge=o=>`<span class="ovr ${tier(o)} num">${o}</span>`;
const topBar=(title,meta,backAct="home")=>`<div class="top"><button class="back" data-act="${backAct}">‹ Home</button><div class="ttl">${esc(title)}</div><div class="meta num">${meta||""}</div></div>`;
function pitch(slots){
  return `<div class="pitch" role="img" aria-label="Formation">
    <div class="l half"></div><div class="l circ"></div><div class="l boxT"></div><div class="l boxB"></div>
    ${slots.map(s=>`<div class="pchip ${s.player?"full":""}" style="left:${s.x}%;top:${s.y}%">
      <div class="disc ${s.player?tier(s.player.ovr):""}">${s.player?s.player.ovr:""}</div>
      ${s.player?`<div class="pn">${esc(shortName(s.player.name))}</div>`:""}<div class="pk">${s.k}</div></div>`).join("")}
  </div>`;
}
function slotList(slots){
  return `<div class="list">${slots.map(s=>`<div class="item ${s.player?"":"off"}">
    <span class="pos">${s.k}</span>
    <div style="min-width:0"><div class="nm">${s.player?esc(s.player.name):"Open"}</div>${s.player?`<div class="note">${esc(s.player.team)} · ${s.player.pos}</div>`:""}</div>
    ${s.player?ovrBadge(s.player.ovr):`<span class="ovr empty">–</span>`}</div>`).join("")}</div>`;
}
function attrBars(slots){
  return `<div class="bars">${slots.map(s=>`<div class="bar"><div class="k">${s.k}<small>${s.from?esc(s.from):s.label}</small></div>
    <div class="trk"><div class="fill" style="width:${s.val?(s.val-50)*2:0}%"></div></div><div class="v num">${s.val??"–"}</div></div>`).join("")}</div>`;
}

function viewHome(){
  return `<div class="hero"><h1>Draft<span>Night</span></h1>
    <p>Spin a team, take one player, build a contender. Then simulate the season and see where you finish.</p></div>
  <div class="modes">${Object.entries(MODES).map(([k,m])=>{const b=store.get("draftnight.best."+k);
    return `<button class="mode" data-act="start" data-k="${k}"><span class="tag">${m.tag}</span>
      <div><div class="nm">${m.label}</div><div class="ds">${m.desc}</div>${b?`<div class="best">Best: ${esc(b.label)}</div>`:""}</div><span class="go">›</span></button>`;}).join("")}</div>
  <div class="foot">Rosters and overalls are estimates based on the 2025-26 season.</div>`;
}
function viewFormation(){
  const f=S.formation;
  return `${topBar(M().label,"Step 1")}
  <div class="reel"><div class="lbl">Spin your formation</div>
    <div class="txt ${f||S.spinning?"":"idle"} ${S.landed?"land":""}" id="reelTxt">${f||"? - ? - ?"}</div>
    <div class="sub">${f?"Locked in. Every pick has to fit this shape.":"You draft into whatever shape you land."}</div></div>
  ${f?`<button class="btn" data-act="startDraft">Start the draft</button>${pitch(S.slots)}`:`<button class="btn" data-act="spinF" ${S.spinning?"disabled":""}>${S.spinning?"Spinning…":"Spin formation"}</button>`}`;
}
function viewDraft(){
  const m=M(),ufc=S.mode==="ufc";
  const filled=S.slots.filter(s=>ufc?s.val!==null:s.player).length,total=S.slots.length;
  const t=spunTeam();
  let picks="";
  if(t&&!ufc){
    picks=`<div class="sec"><h2>Pick one from ${esc(t.name)}</h2><div class="list">${[...t.players].sort((a,b)=>b.ovr-a.ovr).map(p=>{
      const taken=S.used.includes(p.id),open=S.slots.filter(s=>!s.player&&fits(p,s)),slot=open.find(s=>natural(p,s))||open[0];
      const ok=!taken&&slot;
      return `<button class="item ${ok?"":"off"}" ${ok?`data-act="pick" data-id="${p.id}"`:"disabled"}>
        <span class="pos">${p.pos}</span><div style="min-width:0"><div class="nm">${esc(p.name)}</div>
        <div class="note">${taken?"Already on your team":ok?`Fills <b>${slot.k}</b>`:"No open slot"}</div></div>${ovrBadge(p.ovr)}</button>`;}).join("")}</div></div>`;
  }
  if(t&&ufc){
    picks=`<div class="sec"><h2>Take one attribute from ${esc(t.name)} <span style="color:var(--chalk)">· ${t.ovr} OVR</span></h2><div class="attrs">${S.slots.map(s=>{
      const v=t.a[s.k],ok=s.val===null;
      return `<button class="attr ${ok?"":"off"}" ${ok?`data-act="attr" data-k="${s.k}"`:"disabled"}><span class="k">${s.k}<small>${ok?s.label:"Filled · "+s.val}</small></span>${ovrBadge(v)}</button>`;}).join("")}</div></div>`;
  }
  const reelTxt=t?t.name:S.spinning?"…":(ufc?"Who's next?":"Spin a team");
  return `${topBar(m.label,`Pick ${Math.min(filled+1,total)}/${total}`)}
  <div class="reel"><div class="lbl">${ufc?"Fighter":"Team"} on the clock</div>
    <div class="txt ${t||S.spinning?"":"idle"} ${S.landed&&t?"land":""}" id="reelTxt">${esc(reelTxt)}</div>
    <div class="sub">${t?(ufc?esc(t.div):`Team OVR ${Math.round(t.rating)}`):S.formation?S.formation:""}</div></div>
  <div class="row">${t?`<button class="btn ghost" data-act="respin" ${S.respins>0?"":"disabled"}>Re-spin (${S.respins})</button>`:`<button class="btn" data-act="spin" ${S.spinning?"disabled":""}>${S.spinning?"Spinning…":"Spin"}</button>`}</div>
  ${picks}
  <div class="sec"><h2>${ufc?"Your fighter":"Your roster"}${S.formation?" · "+S.formation:""}</h2>
  ${ufc?attrBars(S.slots):m.kind==="soccer"?pitch(S.slots):slotList(S.slots)}</div>`;
}
function viewReview(){
  const m=M(),r=userRating(),ufc=S.mode==="ufc";
  let proj;
  if(ufc){const better=FIGHTERS.filter(f=>f.ovr>r).length;proj=`Pound-for-pound on paper: <b>No. ${better+1}</b> of ${FIGHTERS.length+1}`;}
  else{const lg=leagueOf(S.mode).sort((a,b)=>a-b);lg.shift();const better=lg.filter(x=>x>r).length;proj=`On paper: <b>${ord(better+1)}</b> of ${lg.length+1}`;}
  return `${topBar(m.label,"Draft complete")}
  <div class="big"><div class="ovrbig num">${Math.round(r)}<small>OVR</small></div>
    <div class="info"><label for="teamName">${ufc?"Fighter name":"Team name"}</label><input id="teamName" maxlength="28" value="${esc(S.teamName)}" autocomplete="off"><div class="proj">${proj}</div></div></div>
  <button class="btn" data-act="sim">${m.verb}</button>
  <div class="sec"><h2>${ufc?"Attributes":"Roster"}</h2>${ufc?attrBars(S.slots):m.kind==="soccer"?pitch(S.slots)+slotList(S.slots):slotList(S.slots)}</div>`;
}
function viewSim(){
  const r=S.result;
  return `${topBar(M().label,"")}
  <div class="simwrap"><div class="txt">${S.mode==="ufc"?"Fight week":"Simulating"}</div>
  <div class="prog"><i id="simBar"></i></div>
  <div class="chips" id="simChips">${r.log.map(g=>`<span class="chip ${g.r}" style="visibility:hidden">${g.r}</span>`).join("")}</div></div>`;
}
function viewResults(){
  const r=S.result,m=M();
  return `${topBar(m.label,"Final")}
  <div class="verdict ${r.tone}"><div class="eb num">${esc(r.eyebrow)}${S.newBest?" · New best":""}</div><h2>${esc(r.headline)}</h2><p>${esc(r.sub)}</p></div>
  <div class="stats">${r.stats.map(([v,k])=>`<div class="stat"><div class="v num">${esc(v)}</div><div class="k">${k}</div></div>`).join("")}</div>
  <div class="row"><button class="btn" data-act="again">Draft again</button><button class="btn ghost sm" data-act="home">Sports</button></div>
  ${r.path.length?`<div class="sec path"><h2>${S.mode==="ufc"?"Fight log":"Road through the knockouts"}</h2><div class="list">${r.path.map(p=>`<div class="item"><div style="min-width:0"><div class="nm">${esc(p.opp)}</div><div class="note">${esc(p.round)}${S.mode==="ufc"?" · "+esc(p.s):""}</div></div><span class="res ${p.r}">${p.r}${S.mode==="ufc"?"":" "+esc(p.s)}</span></div>`).join("")}</div></div>`:""}
  ${S.mode!=="ufc"?`<div class="sec"><h2>${S.mode==="ucl"?"League phase":"Regular season"} results</h2><div class="chips" style="justify-content:flex-start">${r.log.map(g=>`<span class="chip ${g.r}" title="${esc(g.opp+" "+g.s)}">${g.r}</span>`).join("")}</div></div>`:""}
  <div class="sec"><h2>${S.mode==="ufc"?"Rankings":"Standings"}</h2><div class="tblwrap"><table><thead><tr>${r.table.head.map((h,i)=>`<th class="${i===0?"p":i===1?"n":""}">${h}</th>`).join("")}</tr></thead>
  <tbody>${r.table.rows.map(row=>`<tr class="${row.you?"you":""} ${row.zone?"zone"+row.zone:""}">${row.c.map((c,i)=>`<td class="${i===0?"p":i===1?"n":""}">${i===1&&row.you?"★ ":""}${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
  <div class="legend">${r.table.legend}</div></div>`;
}
function render(){
  const v={home:viewHome,formation:viewFormation,draft:viewDraft,review:viewReview,sim:viewSim,results:viewResults}[S.screen]||viewHome;
  document.getElementById("app").innerHTML=v();
  const rt=document.getElementById("reelTxt");if(rt)fitReel(rt,rt.textContent);
  S.landed=false;
}

document.getElementById("app").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==="home"){S={screen:"home"};render();scrollTo(0,0);}
  else if(a==="start")startMode(b.dataset.k);
  else if(a==="spinF")spinFormation();
  else if(a==="startDraft"){S.screen="draft";render();}
  else if(a==="spin")spin(false);
  else if(a==="respin"&&S.respins>0)spin(true);
  else if(a==="pick")draftPlayer(b.dataset.id);
  else if(a==="attr")takeAttr(b.dataset.k);
  else if(a==="sim")simulate();
  else if(a==="again")startMode(S.mode);
});
document.getElementById("app").addEventListener("input",e=>{if(e.target.id==="teamName")S.teamName=e.target.value;});

window.claude?.hot?.snapshot?.(()=>({S}));
const boot=d=>{if(d&&d.S&&d.S.screen){S=d.S;S.spinning=false;if(S.screen==="sim")S.screen="results";}render();};
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
